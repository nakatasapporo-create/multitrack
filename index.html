
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <title>かんたん4トラック音声ミキサー</title>
  <meta name="description" content="音楽1本に音声3本を重ねて、プレビューとWAV保存ができる簡易マルチトラックエディタ">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101522'/%3E%3Cpath d='M14 22h36M14 32h36M14 42h36' stroke='%236be7c8' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='22' r='6' fill='%23ffbe5c'/%3E%3Ccircle cx='41' cy='32' r='6' fill='%23ff728a'/%3E%3Ccircle cx='31' cy='42' r='6' fill='%2376a9ff'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#0b0f19;--panel:#141b2a;--panel2:#1a2335;--line:#2a3750;--text:#f3f7ff;--muted:#9babca;--mint:#6be7c8;--orange:#ffbe5c;--pink:#ff728a;--blue:#76a9ff;--danger:#ff6677;--r:16px;color-scheme:dark;font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#24345a 0,transparent 36rem),var(--bg);color:var(--text);font-size:16px;min-height:100vh}button,input{font:inherit}button{touch-action:manipulation}.app{max-width:1200px;margin:auto;padding:18px 18px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}.brand h1{font-size:clamp(1.25rem,3vw,1.85rem);margin:0}.brand p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem}.transport{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:#202b40;color:var(--text);border-radius:12px;padding:11px 15px;min-height:44px;cursor:pointer;font-weight:700}.btn:hover{border-color:#50617d}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.primary{background:var(--mint);border-color:var(--mint);color:#082019}.btn.export{background:var(--orange);border-color:var(--orange);color:#2b1900}.time{font-variant-numeric:tabular-nums;min-width:112px;text-align:center;color:var(--muted)}.board{background:rgba(20,27,42,.92);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 24px 80px #0006}.scale-row,.track{display:grid;grid-template-columns:260px minmax(420px,1fr)}.scale-side{padding:10px 14px;color:var(--muted);font-size:.8rem;border-right:1px solid var(--line)}.scale{height:34px;position:relative;background:#101624;border-bottom:1px solid var(--line);overflow:hidden}.tick{position:absolute;bottom:0;border-left:1px solid #41506b;height:10px;color:#8291ad;font-size:.7rem;padding-left:4px}.track{min-height:132px;border-bottom:1px solid var(--line)}.track:last-child{border-bottom:0}.control{padding:14px;border-right:1px solid var(--line);background:linear-gradient(135deg,#182134,#131a28)}.track-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.track-title{display:flex;align-items:center;gap:9px;font-weight:800}.dot{width:11px;height:11px;border-radius:50%;background:var(--c)}.load{display:inline-block;cursor:pointer}.load input{display:none}.mini{padding:7px 10px;min-height:34px;font-size:.82rem}.filename{display:block;color:var(--muted);font-size:.77rem;margin:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sliders label{font-size:.75rem;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--c);margin-top:5px}.toggles{display:flex;gap:6px;margin-top:9px}.toggle.active{background:var(--danger);border-color:var(--danger);color:white}.timeline{position:relative;background-color:#0f1522;background-image:linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:5% 100%;overflow:hidden;user-select:none;touch-action:none}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#6f7f9c;font-size:.88rem;text-align:center;padding:20px}.clip{position:absolute;top:17px;height:98px;min-width:14px;border:1px solid color-mix(in srgb,var(--c),white 20%);background:color-mix(in srgb,var(--c),transparent 76%);border-radius:10px;overflow:hidden;box-shadow:0 7px 20px #0005;cursor:grab;touch-action:none}.clip:active{cursor:grabbing}.clip.music{cursor:default}.clip canvas{width:100%;height:100%;display:block;opacity:.9}.clip-label{position:absolute;top:5px;left:8px;right:8px;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000}.playhead{position:absolute;z-index:6;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 8px #fff8;pointer-events:none}.playhead:before{content:"";position:absolute;top:0;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #fff}.help{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.82rem;padding:12px 4px 0}.status{min-height:1.3em}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:760px){.app{padding:12px 10px 28px}.top{align-items:flex-start;flex-direction:column}.transport{justify-content:flex-start}.scale-row,.track{grid-template-columns:148px minmax(520px,1fr)}.board-wrap{overflow-x:auto;border-radius:var(--r)}.board{min-width:760px}.control{padding:10px}.sliders{grid-template-columns:1fr}.brand p{font-size:.82rem}.help{display:block}.help span{display:block;margin-bottom:5px}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><h1>かんたん4トラック音声ミキサー</h1><p>音楽に3つの音声を重ねて、そのままWAVで保存できます。</p></div>
    <div class="transport">
      <button class="btn primary" id="play" disabled>▶ 再生</button>
      <button class="btn" id="stop" disabled>■ 停止</button>
      <span class="time" id="clock">00:00.0 / 00:00.0</span>
      <button class="btn export" id="export" disabled>WAVを保存</button>
    </div>
  </header>
  <div class="board-wrap"><section class="board" aria-label="音声編集タイムライン">
    <div class="scale-row"><div class="scale-side">時間</div><div class="scale" id="scale"></div></div>
    <div id="tracks"></div>
  </section></div>
  <div class="help"><span>音声トラックは、波形を指やマウスで左右に動かして開始位置を変えられます。</span><span class="status" id="status" aria-live="polite"></span></div>
</main>
<script>
(() => {
  const colors=['#6be7c8','#ffbe5c','#ff728a','#76a9ff'];
  const specs=[['音楽（BGM）','音楽ファイルを選択'],['音声 1','音声ファイルを選択'],['音声 2','音声ファイルを選択'],['音声 3','音声ファイルを選択']];
  const state={ctx:null,tracks:specs.map((s,i)=>({name:s[0],buffer:null,file:'未選択',offset:0,gain:i?1:.65,fadeIn:0,fadeOut:0,muted:false,color:colors[i]})),duration:30,playAt:0,startedAt:0,sources:[],raf:0,playing:false};
  const $=s=>document.querySelector(s), tracksEl=$('#tracks'), status=$('#status');
  const fmt=t=>{t=Math.max(0,t||0);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}.${Math.floor(t%1*10)}`};
  function audioCtx(){return state.ctx||(state.ctx=new (window.AudioContext||window.webkitAudioContext)());}
  function projectDuration(){const ends=state.tracks.filter(t=>t.buffer).map(t=>t.offset+t.buffer.duration);return Math.max(1,...ends);}
  function setStatus(msg){status.textContent=msg;}
  function render(){
    state.duration=projectDuration(); tracksEl.innerHTML='';
    state.tracks.forEach((t,i)=>{
      const row=document.createElement('div');row.className='track';row.style.setProperty('--c',t.color);
      row.innerHTML=`<div class="control"><div class="track-head"><span class="track-title"><i class="dot"></i>${t.name}</span><label class="btn mini load">選択<input type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg"></label></div><span class="filename" title="${esc(t.file)}">${esc(t.file)}</span><div class="sliders"><label>音量 <b>${Math.round(t.gain*100)}%</b><input data-k="gain" type="range" min="0" max="1.5" step=".01" value="${t.gain}"></label><label>開始 <b>${t.offset.toFixed(1)}秒</b><input data-k="offset" type="range" min="0" max="${Math.max(1,state.duration)}" step=".1" value="${t.offset}" ${i===0?'disabled':''}></label><label>フェードイン <b>${t.fadeIn.toFixed(1)}秒</b><input data-k="fadeIn" type="range" min="0" max="10" step=".1" value="${t.fadeIn}"></label><label>フェードアウト <b>${t.fadeOut.toFixed(1)}秒</b><input data-k="fadeOut" type="range" min="0" max="10" step=".1" value="${t.fadeOut}"></label></div><div class="toggles"><button class="btn mini toggle ${t.muted?'active':''}" data-mute>${t.muted?'ミュート中':'ミュート'}</button>${t.buffer?'<button class="btn mini" data-clear>取り消す</button>':''}</div></div><div class="timeline"><div class="empty">${t.buffer?'':'ここにファイルの波形が表示されます'}</div><div class="playhead" style="left:${state.playAt/state.duration*100}%"></div></div>`;
      const input=row.querySelector('input[type=file]');input.onchange=e=>loadFile(i,e.target.files[0]);
      row.querySelectorAll('input[type=range]').forEach(el=>el.oninput=()=>{t[el.dataset.k]=+el.value;if(el.dataset.k==='offset') t.offset=Math.min(t.offset,Math.max(0,state.duration-(t.buffer?.duration||0)*.05));render();});
      row.querySelector('[data-mute]').onclick=()=>{t.muted=!t.muted;render();};
      row.querySelector('[data-clear]')?.addEventListener('click',()=>{stop();Object.assign(t,{buffer:null,file:'未選択',offset:0});render();});
      const timeline=row.querySelector('.timeline'); timeline.onclick=e=>{if(e.target.closest('.clip'))return;seek((e.offsetX/timeline.clientWidth)*state.duration);};
      if(t.buffer){const clip=document.createElement('div');clip.className='clip'+(i===0?' music':'');clip.style.left=`${t.offset/state.duration*100}%`;clip.style.width=`${Math.max(.8,t.buffer.duration/state.duration*100)}%`;clip.innerHTML=`<canvas></canvas><span class="clip-label">${esc(t.file)}</span>`;timeline.appendChild(clip);drawWave(clip.querySelector('canvas'),t);if(i)dragClip(clip,t,timeline);}
      tracksEl.appendChild(row);
    });
    drawScale(); updateControls(); updateClock();
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  async function loadFile(i,file){if(!file)return;stop();setStatus(`${file.name} を読み込み中…`);try{const ab=await file.arrayBuffer();const buf=await audioCtx().decodeAudioData(ab.slice(0));Object.assign(state.tracks[i],{buffer:buf,file:file.name,offset:i?state.tracks[i].offset:0});setStatus('読み込みました');render();}catch(e){setStatus('この音声形式を読み込めませんでした。MP3・M4A・WAVをお試しください。');}}
  function drawWave(canvas,t){const dpr=devicePixelRatio||1,w=Math.max(100,canvas.clientWidth),h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const data=t.buffer.getChannelData(0),step=Math.max(1,Math.floor(data.length/w));c.strokeStyle=t.color;c.lineWidth=1.2;c.beginPath();for(let x=0;x<w;x++){let lo=1,hi=-1;for(let j=0;j<step;j++){const v=data[x*step+j]||0;if(v<lo)lo=v;if(v>hi)hi=v}c.moveTo(x,(1+lo)*h/2);c.lineTo(x,(1+hi)*h/2)}c.stroke();}
  function dragClip(el,t,timeline){let startX,startOffset;const move=e=>{e.preventDefault();const x=e.touches?e.touches[0].clientX:e.clientX;t.offset=Math.max(0,Math.min(state.duration-t.buffer.duration*.04,startOffset+(x-startX)/timeline.clientWidth*state.duration));el.style.left=`${t.offset/state.duration*100}%`;};const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('touchmove',move);removeEventListener('touchend',up);render();};const down=e=>{startX=e.touches?e.touches[0].clientX:e.clientX;startOffset=t.offset;addEventListener(e.type==='touchstart'?'touchmove':'pointermove',move,{passive:false});addEventListener(e.type==='touchstart'?'touchend':'pointerup',up,{once:true});};el.addEventListener('pointerdown',down);}
  function drawScale(){const s=$('#scale');s.innerHTML='';const n=5;for(let i=0;i<=n;i++){const x=document.createElement('span');x.className='tick';x.style.left=`${i/n*100}%`;x.textContent=fmt(state.duration*i/n).slice(0,5);s.appendChild(x);}}
  function envelope(g,t,when){const dur=t.buffer.duration,fi=Math.min(t.fadeIn,dur),fo=Math.min(t.fadeOut,dur-fi),v=t.muted?0:t.gain;g.gain.cancelScheduledValues(when);if(fi){g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(v,when+fi)}else g.gain.setValueAtTime(v,when);if(fo){g.gain.setValueAtTime(v,when+dur-fo);g.gain.linearRampToValueAtTime(0,when+dur);}}
  async function play(){if(!state.tracks.some(t=>t.buffer))return;stop(false);const ctx=audioCtx();await ctx.resume();state.playing=true;state.startedAt=ctx.currentTime-state.playAt;state.tracks.forEach(t=>{if(!t.buffer||t.muted)return;const local=state.playAt-t.offset;if(local>=t.buffer.duration)return;const delay=Math.max(0,t.offset-state.playAt),from=Math.max(0,local),src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=t.buffer;src.connect(g).connect(ctx.destination);envelope(g,t,ctx.currentTime+delay-from);src.start(ctx.currentTime+delay,from);state.sources.push(src);});tick();updateControls();}
  function stop(reset=true){state.sources.forEach(s=>{try{s.stop()}catch{}});state.sources=[];cancelAnimationFrame(state.raf);state.playing=false;if(reset)state.playAt=0;updateControls();updateClock();document.querySelectorAll('.playhead').forEach(p=>p.style.left=`${state.playAt/state.duration*100}%`);}
  function seek(t){const was=state.playing;stop(false);state.playAt=Math.max(0,Math.min(t,state.duration));if(was)play();else{updateClock();render();}}
  function tick(){if(!state.playing)return;state.playAt=audioCtx().currentTime-state.startedAt;if(state.playAt>=state.duration){stop();return}updateClock();document.querySelectorAll('.playhead').forEach(p=>p.style.left=`${state.playAt/state.duration*100}%`);state.raf=requestAnimationFrame(tick);}
  function updateClock(){$('#clock').textContent=`${fmt(state.playAt)} / ${fmt(state.duration)}`;}
  function updateControls(){const has=state.tracks.some(t=>t.buffer);$('#play').disabled=!has||state.playing;$('#stop').disabled=!has;$('#export').disabled=!has||state.playing;$('#play').textContent=state.playAt>0?'▶ 続きから再生':'▶ 再生';}
  async function exportWav(){stop();const btn=$('#export');btn.disabled=true;setStatus('音声を合成しています…');try{const rate=44100,dur=projectDuration(),off=new OfflineAudioContext(2,Math.ceil(dur*rate),rate);state.tracks.forEach(t=>{if(!t.buffer||t.muted)return;const src=off.createBufferSource(),g=off.createGain();src.buffer=t.buffer;src.connect(g).connect(off.destination);envelope(g,t,t.offset);src.start(t.offset);});const rendered=await off.startRendering(),blob=wavBlob(rendered),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`合成音声_${new Date().toISOString().slice(0,10)}.wav`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);setStatus('WAVファイルを保存しました');}catch(e){setStatus('合成に失敗しました。音声を短くして再度お試しください。');}finally{updateControls();}}
  function wavBlob(b){const n=b.length,ch=Math.min(2,b.numberOfChannels),ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);let p=0;const str=s=>{for(const c of s)v.setUint8(p++,c.charCodeAt(0))},u16=x=>{v.setUint16(p,x,true);p+=2},u32=x=>{v.setUint32(p,x,true);p+=4};str('RIFF');u32(36+n*ch*2);str('WAVEfmt ');u32(16);u16(1);u16(ch);u32(b.sampleRate);u32(b.sampleRate*ch*2);u16(ch*2);u16(16);str('data');u32(n*ch*2);const cs=Array.from({length:ch},(_,i)=>b.getChannelData(i));for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const x=Math.max(-1,Math.min(1,cs[c][i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'});}
  $('#play').onclick=play;$('#stop').onclick=()=>stop();$('#export').onclick=exportWav;window.addEventListener('resize',()=>{document.querySelectorAll('.clip canvas').forEach((c,i)=>{});render();});render();
})();
</script>
</body>
</html>
