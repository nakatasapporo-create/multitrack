
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <title>かんたん4トラック音声ミキサー</title>
  <meta name="description" content="音楽1本に音声3本を重ねて、プレビューとWAV保存ができる簡易マルチトラックエディタ">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101522'/%3E%3Cpath d='M14 22h36M14 32h36M14 42h36' stroke='%236be7c8' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='22' r='6' fill='%23ffbe5c'/%3E%3Ccircle cx='41' cy='32' r='6' fill='%23ff728a'/%3E%3Ccircle cx='31' cy='42' r='6' fill='%2376a9ff'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#0b0f19;--panel:#141b2a;--panel2:#1a2335;--line:#2a3750;--text:#f3f7ff;--muted:#9babca;--mint:#6be7c8;--orange:#ffbe5c;--pink:#ff728a;--blue:#76a9ff;--danger:#ff6677;--r:16px;color-scheme:dark;font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#24345a 0,transparent 36rem),var(--bg);color:var(--text);font-size:16px;min-height:100vh}button,input{font:inherit}button{touch-action:manipulation}.app{max-width:1200px;margin:auto;padding:18px 18px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}.brand h1{font-size:clamp(1.25rem,3vw,1.85rem);margin:0}.brand p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem}.transport{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:#202b40;color:var(--text);border-radius:12px;padding:11px 15px;min-height:44px;cursor:pointer;font-weight:700}.btn:hover{border-color:#50617d}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.primary{background:var(--mint);border-color:var(--mint);color:#082019}.btn.export{background:var(--orange);border-color:var(--orange);color:#2b1900}.time{font-variant-numeric:tabular-nums;min-width:112px;text-align:center;color:var(--muted)}.board{background:rgba(20,27,42,.92);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 24px 80px #0006}.scale-row,.track{display:grid;grid-template-columns:260px minmax(420px,1fr)}.scale-side{padding:10px 14px;color:var(--muted);font-size:.8rem;border-right:1px solid var(--line)}.scale{height:34px;position:relative;background:#101624;border-bottom:1px solid var(--line);overflow:hidden}.tick{position:absolute;bottom:0;border-left:1px solid #41506b;height:10px;color:#8291ad;font-size:.7rem;padding-left:4px}.track{min-height:132px;border-bottom:1px solid var(--line)}.track:last-child{border-bottom:0}.control{padding:14px;border-right:1px solid var(--line);background:linear-gradient(135deg,#182134,#131a28)}.track-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.track-title{display:flex;align-items:center;gap:9px;font-weight:800}.dot{width:11px;height:11px;border-radius:50%;background:var(--c)}.load{display:inline-block;cursor:pointer}.load input{display:none}.mini{padding:7px 10px;min-height:34px;font-size:.82rem}.filename{display:block;color:var(--muted);font-size:.77rem;margin:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sliders label{font-size:.75rem;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--c);margin-top:5px}.toggles{display:flex;gap:6px;margin-top:9px}.toggle.active{background:var(--danger);border-color:var(--danger);color:white}.timeline{position:relative;background-color:#0f1522;background-image:linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:5% 100%;overflow:hidden;user-select:none;touch-action:none}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#6f7f9c;font-size:.88rem;text-align:center;padding:20px}.clip{position:absolute;top:17px;height:98px;min-width:14px;border:1px solid color-mix(in srgb,var(--c),white 20%);background:color-mix(in srgb,var(--c),transparent 76%);border-radius:10px;overflow:hidden;box-shadow:0 7px 20px #0005;cursor:grab;touch-action:none}.clip:active{cursor:grabbing}.clip canvas{width:100%;height:100%;display:block;opacity:.9}.clip-label{position:absolute;top:5px;left:8px;right:8px;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000}.playhead{position:absolute;z-index:6;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 8px #fff8;pointer-events:none}.playhead:before{content:"";position:absolute;top:0;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #fff}.help{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.82rem;padding:12px 4px 0}.status{min-height:1.3em}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .trim-editor{position:relative;margin:132px 14px 14px;padding:10px 12px;background:#182134;border:1px solid var(--line);border-radius:12px;font-size:14px}.trim-editor summary{cursor:pointer;min-height:32px;font-weight:700}.trim-editor p{color:var(--muted);margin:6px 0 12px;line-height:1.6}.trim-field{display:grid;grid-template-columns:105px minmax(80px,1fr) 94px;align-items:center;gap:10px;margin:10px 0}.trim-field input[type=range]{min-height:40px;margin:0}.trim-field input[type=number]{width:100%;padding:8px 5px;background:#0f1522;color:var(--text);border:1px solid #50617d;border-radius:8px;min-height:44px;font-size:16px}.trim-footer{display:flex;gap:12px;align-items:center;justify-content:space-between}.trim-editor .btn{min-height:44px}.trim-duration{font-variant-numeric:tabular-nums}.timeline .clip{min-width:2px}
    @media(max-width:760px){.app{padding:12px 10px 28px}.top{align-items:flex-start;flex-direction:column}.transport{justify-content:flex-start}.scale-row,.track{grid-template-columns:148px minmax(520px,1fr)}.board-wrap{overflow-x:auto;border-radius:var(--r)}.board{min-width:760px}.control{padding:10px}.sliders{grid-template-columns:1fr}.brand p{font-size:.82rem}.help{display:block}.help span{display:block;margin-bottom:5px}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><h1>かんたん4トラック音声ミキサー</h1><p>音楽に3つの音声を重ねて、そのままWAVで保存できます。トリミングを押すと、各トラックの音楽や音声をトリミングできます。</p></div>
    <div class="transport">
      <button class="btn primary" id="play" disabled>▶ 再生</button>
      <button class="btn" id="stop" disabled>■ 停止</button>
      <span class="time" id="clock">00:00.0 / 00:00.0</span>
      <button class="btn export" id="export" disabled>WAVを保存</button>
    </div>
  </header>
  <div class="board-wrap"><section class="board" aria-label="音声編集タイムライン">
    <div class="scale-row"><div class="scale-side">時間</div><div class="scale" id="scale"></div></div>
    <div id="tracks"></div>
  </section></div>
  <div class="help"><span>すべてのトラックは、波形を指やマウスで左右に動かして開始位置を変えられます。</span><span class="status" id="status" aria-live="polite"></span></div>
</main>
<script>
(() => {
  const colors=['#6be7c8','#ffbe5c','#ff728a','#76a9ff'];
  const specs=[['音楽（BGM）','音楽ファイルを選択'],['音声 1','音声ファイルを選択'],['音声 2','音声ファイルを選択'],['音声 3','音声ファイルを選択']];
  const state={ctx:null,tracks:specs.map((s,i)=>({name:s[0],buffer:null,file:'未選択',offset:0,trimStart:0,trimEnd:0,gain:i?1:.65,fadeIn:0,fadeOut:0,muted:false,color:colors[i]})),duration:30,playAt:0,startedAt:0,sources:[],raf:0,playing:false,playRequest:0};
  const $=s=>document.querySelector(s), tracksEl=$('#tracks'), status=$('#status');
  const fmt=t=>{t=Math.max(0,t||0);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}.${Math.floor(t%1*10)}`};
  function audioCtx(){return state.ctx||(state.ctx=new (window.AudioContext||window.webkitAudioContext)());}
  function trackDuration(t){return t.buffer?Math.max(0,t.trimEnd-t.trimStart):0;}
  function projectDuration(){const ends=state.tracks.filter(t=>t.buffer).map(t=>t.offset+trackDuration(t));return ends.length?Math.max(...ends):1;}
  function setStatus(msg){status.textContent=msg;}
  function render(){
    state.duration=projectDuration(); tracksEl.innerHTML='';
    state.tracks.forEach((t,i)=>{
      const row=document.createElement('div');row.className='track';row.style.setProperty('--c',t.color);
      row.innerHTML=`<div class="control"><div class="track-head"><span class="track-title"><i class="dot"></i>${t.name}</span><label class="btn mini load">選択<input type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg"></label></div><span class="filename" title="${esc(t.file)}">${esc(t.file)}</span><div class="sliders"><label>音量 <b>${Math.round(t.gain*100)}%</b><input data-k="gain" type="range" min="0" max="1.5" step=".01" value="${t.gain}"></label><label>配置位置 <b>${t.offset.toFixed(1)}秒</b><input data-k="offset" type="range" min="0" max="${Math.max(1,state.duration)}" step=".1" value="${t.offset}"></label><label>フェードイン <b>${t.fadeIn.toFixed(1)}秒</b><input data-k="fadeIn" type="range" min="0" max="10" step=".1" value="${t.fadeIn}"></label><label>フェードアウト <b>${t.fadeOut.toFixed(1)}秒</b><input data-k="fadeOut" type="range" min="0" max="10" step=".1" value="${t.fadeOut}"></label></div><div class="toggles"><button class="btn mini toggle ${t.muted?'active':''}" data-mute>${t.muted?'ミュート中':'ミュート'}</button>${t.buffer?'<button class="btn mini" data-clear>取り消す</button>':''}</div></div><div class="timeline"><div class="empty">${t.buffer?'':'ここにファイルの波形が表示されます'}</div><div class="playhead" style="left:${state.playAt/state.duration*100}%"></div></div>`;
      const input=row.querySelector('input[type=file]');input.onchange=e=>loadFile(i,e.target.files[0]);
      row.querySelectorAll('input[data-k]').forEach(el=>el.oninput=()=>{t[el.dataset.k]=+el.value;if(el.dataset.k==='gain'){el.parentElement.querySelector('b').textContent=Math.round(t.gain*100)+'%';updateLiveVolume(t);return;}stopForEdit();el.parentElement.querySelector('b').textContent=(+el.value).toFixed(1)+'秒';refreshTimeline();});
      row.querySelector('[data-mute]').onclick=()=>{t.muted=!t.muted;updateLiveVolume(t);render();};
      row.querySelector('[data-clear]')?.addEventListener('click',()=>{stop();Object.assign(t,{buffer:null,file:'未選択',offset:0});render();});
      const timeline=row.querySelector('.timeline'); timeline.onclick=e=>{if(e.target.closest('.clip,.trim-editor'))return;seek((e.clientX-timeline.getBoundingClientRect().left)/timeline.clientWidth*state.duration);};
      tracksEl.appendChild(row);
      if(t.buffer){const clip=document.createElement('div');clip.className='clip';clip.style.left=`${t.offset/state.duration*100}%`;clip.style.width=`${trackDuration(t)/state.duration*100}%`;clip.innerHTML=`<canvas></canvas><span class="clip-label">${esc(t.file)}</span>`;timeline.appendChild(clip);drawWave(clip.querySelector('canvas'),t);dragClip(clip,t,timeline);addTrimEditor(t,timeline,i);}
    });
    drawScale(); updateControls(); updateClock();
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  async function loadFile(i,file){if(!file)return;stop();setStatus(`${file.name} を読み込み中…`);try{const ab=await file.arrayBuffer();const buf=await audioCtx().decodeAudioData(ab.slice(0));Object.assign(state.tracks[i],{buffer:buf,file:file.name,trimStart:0,trimEnd:buf.duration,offset:state.tracks[i].offset});setStatus('読み込みました');render();}catch(e){setStatus('この音声形式を読み込めませんでした。MP3・M4A・WAVをお試しください。');}}
  function drawWave(canvas,t){
    const dpr=devicePixelRatio||1,w=Math.max(1,Math.ceil(canvas.clientWidth)),h=canvas.clientHeight;
    if(!h)return;
    canvas.width=Math.ceil(w*dpr);canvas.height=Math.ceil(h*dpr);
    const c=canvas.getContext('2d');c.scale(dpr,dpr);
    const channels=Array.from({length:t.buffer.numberOfChannels},(_,i)=>t.buffer.getChannelData(i));
    const first=Math.floor(t.trimStart*t.buffer.sampleRate),last=Math.min(t.buffer.length,Math.ceil(t.trimEnd*t.buffer.sampleRate));
    c.strokeStyle=t.color;c.lineWidth=1.2;c.beginPath();
    for(let x=0;x<w;x++){
      const begin=first+Math.floor(x*(last-first)/w),end=Math.min(last,Math.max(begin+1,first+Math.floor((x+1)*(last-first)/w)));
      let lo=0,hi=0;
      for(const data of channels)for(let j=begin;j<end;j++){const v=data[j]||0;lo=Math.min(lo,v);hi=Math.max(hi,v);}
      c.moveTo(x,(1+lo)*h/2);c.lineTo(x,(1+hi)*h/2);
    }c.stroke();
  }
  function stopForEdit(){if(state.playing){stop(false);setStatus('編集のため再生を止めました。「再生」で確認できます。');}}
  function clampTrim(t,edge,value){
    if(!Number.isFinite(value))return;
    const minimum=Math.min(.01,t.buffer.duration);
    if(edge==='trimStart')t.trimStart=Math.max(0,Math.min(value,t.trimEnd-minimum));
    else t.trimEnd=Math.max(t.trimStart+minimum,Math.min(value,t.buffer.duration));
  }
  function addTrimEditor(t,timeline,i){
    const details=document.createElement('details');details.className='trim-editor';details.open=!!t.trimOpen;
    details.innerHTML=`<summary>✂ トリミング <span class="trim-duration"></span></summary><p>元の音声から残す範囲を指定します（秒）。配置位置はそのままで、選んだ部分だけを使います。</p>${[['trimStart','残す開始'],['trimEnd','残す終了']].map(([key,label])=>`<div class="trim-field"><label for="trim-${i}-${key}">${label}（秒）</label><input type="range" data-trim="${key}" min="0" max="${t.buffer.duration}" step="any" value="${t[key]}" aria-label="${t.name} ${label}"><input id="trim-${i}-${key}" data-trim="${key}" type="number" min="0" max="${t.buffer.duration}" step="0.01" value="${t[key].toFixed(2)}"></div>`).join('')}<div class="trim-footer"><span>残す長さ <b class="trim-duration"></b></span><button class="btn mini" data-reset-trim>全範囲に戻す</button></div>`;
    details.ontoggle=()=>{t.trimOpen=details.open;};
    const sync=()=>{
      details.querySelectorAll('.trim-duration').forEach(el=>el.textContent=trackDuration(t).toFixed(2)+'秒');
      details.querySelectorAll('[data-trim]').forEach(el=>{el.value=el.type==='number'?t[el.dataset.trim].toFixed(2):t[el.dataset.trim];});
    };
    details.querySelectorAll('[data-trim]').forEach(el=>{
      const edit=()=>{if(el.value==='')return sync();stopForEdit();clampTrim(t,el.dataset.trim,Number(el.value));sync();refreshTimeline();};
      if(el.type==='range')el.oninput=edit;else el.onchange=edit;
    });
    details.querySelector('[data-reset-trim]').onclick=()=>{stopForEdit();t.trimStart=0;t.trimEnd=t.buffer.duration;sync();refreshTimeline();};
    timeline.appendChild(details);sync();
  }
  function refreshTimeline(){
    state.duration=projectDuration();state.playAt=Math.min(state.playAt,state.duration);
    tracksEl.querySelectorAll('.track').forEach((row,i)=>{
      const t=state.tracks[i],clip=row.querySelector('.clip');
      if(clip){clip.style.left=`${t.offset/state.duration*100}%`;clip.style.width=`${trackDuration(t)/state.duration*100}%`;drawWave(clip.querySelector('canvas'),t);}
      row.querySelector('.playhead').style.left=`${state.playAt/state.duration*100}%`;
      const offset=row.querySelector('[data-k="offset"]');offset.max=Math.max(1,state.duration);offset.value=t.offset;
    });drawScale();updateClock();updateControls();
  }
  function dragClip(el,t,timeline){let startX,startOffset;const move=e=>{e.preventDefault();const x=e.touches?e.touches[0].clientX:e.clientX;t.offset=Math.max(0,Math.min(state.duration-trackDuration(t)*.04,startOffset+(x-startX)/timeline.clientWidth*state.duration));el.style.left=`${t.offset/state.duration*100}%`;};const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('touchmove',move);removeEventListener('touchend',up);render();};const down=e=>{stopForEdit();startX=e.touches?e.touches[0].clientX:e.clientX;startOffset=t.offset;addEventListener(e.type==='touchstart'?'touchmove':'pointermove',move,{passive:false});addEventListener(e.type==='touchstart'?'touchend':'pointerup',up,{once:true});};el.addEventListener('pointerdown',down);}
  function drawScale(){const s=$('#scale');s.innerHTML='';const n=5;for(let i=0;i<=n;i++){const x=document.createElement('span');x.className='tick';x.style.left=`${i/n*100}%`;x.textContent=fmt(state.duration*i/n).slice(0,5);s.appendChild(x);}}
  function envelope(g,t,when,elapsed=0){
    const dur=trackDuration(t),fi=Math.min(t.fadeIn,dur),fo=Math.min(t.fadeOut,dur-fi),v=t.muted?0:t.gain;
    const level=x=>fi>0&&x<fi?v*x/fi:fo>0&&x>dur-fo?v*(dur-x)/fo:v;
    g.gain.setValueAtTime(level(elapsed),when);
    if(fi>elapsed)g.gain.linearRampToValueAtTime(v,when+fi-elapsed);
    if(fo){if(dur-fo>elapsed)g.gain.setValueAtTime(v,when+dur-fo-elapsed);g.gain.linearRampToValueAtTime(0,when+dur-elapsed);}
  }
  function scheduleTrack(ctx,t,position,baseTime,live){
    const duration=trackDuration(t),elapsed=Math.max(0,position-t.offset);
    if(!t.buffer||elapsed>=duration)return null;
    const when=baseTime+Math.max(0,t.offset-position),src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=t.buffer;
    if(live){const volume=ctx.createGain();t.liveVolume=volume;volume.gain.setValueAtTime(t.muted?0:t.gain,baseTime);src.connect(g).connect(volume).connect(ctx.destination);envelope(g,{...t,gain:1,muted:false},when,elapsed);}
    else {src.connect(g).connect(ctx.destination);envelope(g,t,when,elapsed);}
    src.start(when,t.trimStart+elapsed,duration-elapsed);return src;
  }
  function updateLiveVolume(t){if(!t.liveVolume||!state.ctx)return;const now=state.ctx.currentTime;t.liveVolume.gain.cancelScheduledValues(now);t.liveVolume.gain.setTargetAtTime(t.muted?0:t.gain,now,.015);}
  async function play(){
    if(!state.tracks.some(t=>t.buffer))return;
    stop(false);if(state.playAt>=state.duration)state.playAt=0;
    const request=state.playRequest,ctx=audioCtx();
    try{await ctx.resume();if(request!==state.playRequest)return;
      state.playing=true;const baseTime=ctx.currentTime+.02;state.startedAt=baseTime-state.playAt;
      state.tracks.forEach(t=>{const src=scheduleTrack(ctx,t,state.playAt,baseTime,true);if(src)state.sources.push(src);});tick();updateControls();
    }catch(e){stop(false);setStatus('再生できませんでした。もう一度「再生」を押してください。');}
  }
  function stop(reset=true){state.playRequest++;state.sources.forEach(s=>{try{s.stop()}catch{}});state.sources=[];state.tracks.forEach(t=>{if(t.liveVolume)t.liveVolume.disconnect();t.liveVolume=null;});cancelAnimationFrame(state.raf);state.playing=false;if(reset)state.playAt=0;updateControls();updateClock();document.querySelectorAll('.playhead').forEach(p=>p.style.left=`${state.playAt/state.duration*100}%`);}
  function seek(t){const was=state.playing;stop(false);state.playAt=Math.max(0,Math.min(t,state.duration));if(was)play();else{updateClock();render();}}
  function tick(){if(!state.playing)return;state.playAt=Math.max(0,audioCtx().currentTime-state.startedAt);if(state.playAt>=state.duration){stop();return}updateClock();document.querySelectorAll('.playhead').forEach(p=>p.style.left=`${state.playAt/state.duration*100}%`);state.raf=requestAnimationFrame(tick);}
  function updateClock(){$('#clock').textContent=`${fmt(state.playAt)} / ${fmt(state.duration)}`;}
  function updateControls(){const has=state.tracks.some(t=>t.buffer);$('#play').disabled=!has||state.playing;$('#stop').disabled=!has;$('#export').disabled=!has||state.playing;$('#play').textContent=state.playAt>0?'▶ 続きから再生':'▶ 再生';}
  async function exportWav(){stop();const btn=$('#export');btn.disabled=true;setStatus('音声を合成しています…');try{const rate=44100,dur=projectDuration(),off=new OfflineAudioContext(2,Math.ceil(dur*rate),rate);state.tracks.forEach(t=>{if(!t.buffer||t.muted)return;scheduleTrack(off,t,0,0,false);});const rendered=await off.startRendering(),blob=wavBlob(rendered),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`合成音声_${new Date().toISOString().slice(0,10)}.wav`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);setStatus('WAVファイルを保存しました');}catch(e){setStatus('合成に失敗しました。音声を短くして再度お試しください。');}finally{updateControls();}}
  function wavBlob(b){const n=b.length,ch=Math.min(2,b.numberOfChannels),ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab);let p=0;const str=s=>{for(const c of s)v.setUint8(p++,c.charCodeAt(0))},u16=x=>{v.setUint16(p,x,true);p+=2},u32=x=>{v.setUint32(p,x,true);p+=4};str('RIFF');u32(36+n*ch*2);str('WAVEfmt ');u32(16);u16(1);u16(ch);u32(b.sampleRate);u32(b.sampleRate*ch*2);u16(ch*2);u16(16);str('data');u32(n*ch*2);const cs=Array.from({length:ch},(_,i)=>b.getChannelData(i));for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const x=Math.max(-1,Math.min(1,cs[c][i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'});}
  $('#play').onclick=play;$('#stop').onclick=()=>stop();$('#export').onclick=exportWav;window.addEventListener('resize',refreshTimeline);render();
})();
